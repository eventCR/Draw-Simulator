<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw-Simulator MarkⅡ</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // 読み込み失敗(ファイルの置き忘れ・名前違い)を画面に出す
    (function () {
      var missing = [];
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) missing.push((t.getAttribute('src') || t.getAttribute('href')));
      }, true);
      window.addEventListener('load', function () {
        if (!window.Core) missing.push('core_engine.js (Core が起動していません)');
        if (!missing.length) return;
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b91c1c;color:#fff;padding:10px 14px;font:13px/1.5 sans-serif;';
        d.innerHTML = '<b>⚠ 次のファイルを読み込めませんでした:</b> ' + missing.join(', ') +
          '<br>index.html と同じフォルダに、全19ファイルを元の名前のまま置いてください (「(1)」などが付いていないか確認)。';
        document.body.appendChild(d);
      });
    })();
  </script>
</head>
<body>

  <!-- 上部ツールバー : ボタンは data-action で core_engine.js の actions に接続 -->
  <header id="top-toolbar">
    <div class="toolbar-title"><span>📐 Draw-Simulator MarkⅡ</span></div>
    <div class="toolbar-actions">
      <button class="ctrl-btn" id="btnUndo" data-action="undo" title="元に戻す (Ctrl+Z)" disabled>↩️ 戻す</button>
      <button class="ctrl-btn" id="btnRedo" data-action="redo" title="やり直す (Ctrl+Y)" disabled>↪️ 進む</button>
      <span class="toolbar-divider">|</span>
      <button class="btn-action" data-action="save">💾 名前をつけて保存</button>
      <button class="btn-action" data-action="open">📂 開く</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <button class="btn-action btn-primary" data-action="exportPng">📸 画像出力 (.png)</button>
      <button class="btn-action btn-primary" data-action="exportPdf">📄 PDF出力</button>
      <button class="btn-action" id="btn-measure" data-action="measure" title="計測ツール (Escで終了)">📏 計測</button>
      <button class="btn-action" data-action="palette">🛠️ パレット開閉</button>
    </div>
  </header>

  <!-- 名前をつけて保存 -->
  <div id="saveModal">
    <div class="modal-card">
      <div class="modal-title">💾 名前をつけて保存</div>
      <div class="input-box">
        <label for="modalFileName">ファイル名 (.json)</label>
        <input type="text" id="modalFileName" value="Venue_Layout_Mark2.json">
      </div>
      <div class="modal-buttons">
        <button class="btn-action" data-action="closeSave">キャンセル</button>
        <button class="btn-action btn-primary" data-action="confirmSave">保存</button>
      </div>
    </div>
  </div>

  <main id="main-container">
    <canvas id="simCanvas"></canvas>
  </main>

  <!-- HUD: 左上サマリー -->
  <div class="hud-left-top">
    <div class="info-card">
      <div class="card-title"><span>📊 図面サマリー</span><span id="viewModeBadge" class="badge-view">🗺️ 平面図</span></div>
      <div class="stats-row"><span>会場外郭:</span><strong id="statRoom">--</strong></div>
      <div class="stats-row"><span>ステージ:</span><strong id="statStage">--</strong></div>
      <div class="stats-row"><span>客席数:</span><strong id="statSeats">--</strong></div>
      <div class="stats-row text-success"><span>良好 (視界クリア):</span><strong id="statClear">0 席</strong></div>
      <div class="stats-row text-warning"><span>視野干渉 (頭被り):</span><strong id="statPartial">0 席</strong></div>
    </div>
  </div>

  <!-- HUD: 立面スクロール -->
  <div id="top-scrollbar-container">
    <label for="top-scroll-range">↔ 平面スクロール (横):</label>
    <button class="scroll-step-btn" data-action="topStep" data-arg="-2000">◀ -2m</button>
    <input type="range" id="top-scroll-range" min="0" max="0" value="0" step="10">
    <button class="scroll-step-btn" data-action="topStep" data-arg="2000">+2m ▶</button>
  </div>
  <div id="side-scrollbar-container">
    <label for="side-scroll-range">↔ 立面スクロール (奥行き):</label>
    <button class="scroll-step-btn" data-action="sideStep" data-arg="-1000">◀ -1m</button>
    <input type="range" id="side-scroll-range" min="0" max="0" value="0" step="100">
    <button class="scroll-step-btn" data-action="sideStep" data-arg="1000">+1m ▶</button>
    <span id="sideScrollValDisplay" class="slice-val">0.0m</span>
  </div>

  <!-- HUD: 右上コントロール -->
  <div class="top-right-controls">
    <div class="control-panel">
      <button class="view-btn active" id="btn-top" data-action="viewTop">🗺️ 平面図</button>
      <button class="view-btn" id="btn-side" data-action="viewSide">📐 立面図</button>
      <span class="panel-divider">|</span>
      <button class="ctrl-btn" data-action="zoomOut" title="縮小">－</button>
      <span class="zoom-badge" id="zoomBadge">100%</span>
      <button class="ctrl-btn" data-action="zoomIn" title="拡大">＋</button>
      <button class="ctrl-btn" data-action="zoom100" title="等倍">100%</button>
      <button class="ctrl-btn" data-action="center" title="画面中央に配置">中央</button>
      <span class="panel-divider">|</span>
      <button class="ctrl-btn active" id="btn-fov" data-action="toggleFov" title="カメラ視野角の表示">👁️ 視野角</button>
    </div>
  </div>

  <!-- HUD: 左下 意見BOX + 凡例 -->
  <div class="hud-left-bottom">
    <div id="finder-win" class="finder-win">
      <div class="finder-head">
        <span class="finder-title">📺 ファインダー</span>
        <select id="finderCam" class="finder-cam"></select>
        <span class="finder-btns"><button type="button" id="finderSize" title="サイズ切替">⤢</button><button type="button" id="finderMin" title="最小化">－</button></span>
      </div>
      <div class="finder-body">
        <canvas id="finderCanvas" width="960" height="540"></canvas>
        <div id="finderTitle" class="finder-info"></div>
      </div>
    </div>
    <div id="debug-box" class="debug-box">
      <div class="debug-box-header">
        <span class="debug-box-title">🛠️ 意見・デバッグBOX</span>
        <div class="debug-box-actions">
          <button type="button" class="btn-debug-action" data-dbg="clear">消去</button>
          <button type="button" class="btn-debug-action" id="btn-debug-toggle" data-dbg="toggle">－</button>
        </div>
      </div>
      <div id="debug-box-body" class="debug-box-body">
        <div class="debug-tab-bar">
          <button type="button" class="debug-tab-btn active" data-dbg-tab="log">📋 ログ・診断</button>
          <button type="button" class="debug-tab-btn" data-dbg-tab="mail">✉️ ご意見送信</button>
        </div>
        <div id="panel-dbg-log" class="debug-panel active">
          <div id="debug-box-content" class="debug-box-content"></div>
        </div>
        <div id="panel-dbg-mail" class="debug-panel">
          <div class="debug-mail-form">
            <div class="dbg-form-row"><input type="text" id="feedback-sender" placeholder="お名前・担当 (例: クラフト)"></div>
            <div class="dbg-form-row"><textarea id="feedback-content" rows="3" placeholder="不具合報告や欲しい機能を入力..."></textarea></div>
            <div class="dbg-form-footer">
              <label class="dbg-checkbox-label"><input type="checkbox" id="feedback-attach-state" checked> 図面状態を添付</label>
              <button type="button" class="btn-dbg-send" id="btn-dbg-send" data-dbg="send">メール送信</button>
            </div>
            <div id="feedback-status" class="feedback-status-msg"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="legend-symbol sym-stage"></span>ステージ</div>
      <div class="legend-item"><span class="legend-symbol sym-panel"></span>パネル</div>
      <div class="legend-item"><span class="legend-symbol sym-guest"></span>登壇者</div>
      <div class="legend-item"><span class="legend-symbol sym-podium"></span>司会台</div>
      <div class="legend-item"><span class="legend-symbol sym-monitor"></span>モニター</div>
      <div class="legend-item"><span class="legend-symbol sym-cam"></span>カメラ</div>
      <div class="legend-item"><span class="legend-symbol sym-seat"></span>客席(視界OK)</div>
      <div class="legend-item"><span class="legend-symbol sym-seat-bad"></span>頭被り</div>
    </div>
  </div>

  <!-- フローティング操作パレット -->
  <div id="floating-ui">
    <div id="floating-header" title="ドラッグで移動 / ダブルクリックで折りたたみ">
      <span>🛠️ 図面パラメータ設定</span>
      <button class="ctrl-btn" id="palette-collapse" data-action="collapsePalette" title="折りたたみ">▼</button>
    </div>
    <div id="floating-body">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="room">🏛 会場</button>
        <button class="tab-btn" data-tab="facility">🏢 会場設備</button>
        <button class="tab-btn" data-tab="podium">🎤 司会台</button>
        <button class="tab-btn" data-tab="guests">👤 登壇者</button>
        <button class="tab-btn" data-tab="stage_items">🪑 舞台什器</button>
        <button class="tab-btn" data-tab="seats">👥 客席</button>
        <button class="tab-btn" data-tab="camera">🎥 カメラ</button>
        <button class="tab-btn" data-tab="display">👁️ 表示設定</button>
        <button class="tab-btn" data-tab="equipment">🎛️ 機材備品</button>
        <button class="tab-btn" data-tab="monitor">📺 モニター</button>
        <button class="tab-btn" data-tab="bgimage">🖼️ 図面挿入</button>
        <button class="tab-btn" data-tab="ai_gen">🤖 AI生成</button>
      </div>
      <!-- 各 tabN_*.js が init() で #panel-<key> に UI を注入する -->
      <div class="tab-content" id="tab-content-container">
        <div class="tab-panel active" id="panel-room"></div>
        <div class="tab-panel" id="panel-facility"></div>
        <div class="tab-panel" id="panel-podium"></div>
        <div class="tab-panel" id="panel-guests"></div>
        <div class="tab-panel" id="panel-stage_items"></div>
        <div class="tab-panel" id="panel-seats"></div>
        <div class="tab-panel" id="panel-camera"></div>
        <div class="tab-panel" id="panel-display"></div>
        <div class="tab-panel" id="panel-equipment"></div>
        <div class="tab-panel" id="panel-monitor"></div>
        <div class="tab-panel" id="panel-bgimage"></div>
        <div class="tab-panel" id="panel-ai_gen"></div>
      </div>
    </div>
  </div>

  <!-- 読み込み順: core → debug → タブ1-6 → カメラ(base→angle→tab7) → タブ8-12 → 計測 -->
  <script src="core_engine.js"></script>
  <script src="debug_box.js"></script>

  <script src="tab1_room.js"></script>
  <script src="tab2_facility.js"></script>
  <script src="tab3_podium.js"></script>
  <script src="tab4_guests.js"></script>
  <script src="tab5_stage_items.js"></script>
  <script src="tab6_seats.js"></script>

  <script src="camera_base.js"></script>
  <script src="camera_angle.js"></script>
  <script src="tab7_camera.js"></script>

  <script src="tab8_display.js"></script>
  <script src="tab9_equipment.js"></script>
  <script src="tab10_monitor.js"></script>
  <script src="tab11_bgimage.js"></script>
  <script src="tab12_ai_gen.js"></script>

  <script src="measure_tool.js"></script>
  <script src="export_sheet.js"></script>
</body>
</html>
